<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CameraHub</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --text:#e6e9ec; --muted:#8b96a3; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  nav button, .btn { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  nav button.active, .btn.primary { background:var(--accent); border-color:var(--accent); }
  .btn.danger { border-color:var(--bad); color:var(--bad); }
  .btn.small { padding:3px 8px; font-size:12px; }
  .spacer { flex:1; }
  .stat { color:var(--muted); font-size:13px; }
  .stat b { color:var(--text); }
  main { padding:16px; }
  .hidden { display:none !important; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  select, input, textarea { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  .grid { display:grid; gap:6px; }
  .tile { position:relative; background:#000; aspect-ratio:16/9; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .tile iframe { width:100%; height:100%; border:0; }
  .tile .label { position:absolute; left:0; right:0; top:0; padding:4px 8px; font-size:12px; background:linear-gradient(#000c,#0000); display:flex; gap:6px; align-items:center; pointer-events:none; }
  .tile .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .tile.selected { outline:2px solid var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); flex:none; }
  .dot.on { background:var(--ok); }
  .dot.idle { background:var(--muted); }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
  td .sub { color:var(--muted); font-size:12px; word-break:break-all; }
  .err { color:var(--bad); font-size:12px; }
  .banner { background:#3b1d1d; border:1px solid var(--bad); padding:8px 12px; border-radius:6px; margin-bottom:12px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; width:min(560px, calc(100vw - 32px)); padding:0; }
  dialog::backdrop { background:#0009; }
  dialog form { padding:16px; display:grid; gap:10px; }
  dialog h2 { margin:0 0 4px; font-size:16px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint { font-size:12px; color:var(--muted); background:var(--bg); border:1px dashed var(--line); padding:8px; border-radius:6px; word-break:break-all; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .check { display:flex; gap:6px; align-items:center; color:var(--text); }
  @media (max-width: 640px) { .row { grid-template-columns:1fr; } .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <h1>📹 CameraHub</h1>
  <nav>
    <button data-tab="wall" class="active">Màn hình giám sát</button>
    <button data-tab="sources">Nguồn video</button>
  </nav>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
</header>

<main>
  <div id="mtxBanner" class="banner hidden"></div>

  <section id="tab-wall">
    <div class="toolbar">
      <label class="check">Bố cục
        <select id="layout">
          <option value="1">1</option><option value="4" selected>2×2</option>
          <option value="9">3×3</option><option value="16">4×4</option><option value="25">5×5</option>
        </select>
      </label>
      <label class="check">Khu vực <select id="siteFilter"><option value="">Tất cả</option></select></label>
      <label class="check">Trang <select id="page"></select></label>
      <span class="stat">Bấm đúp vào một ô để phóng to / thu nhỏ</span>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="tab-sources" class="hidden">
    <div class="toolbar">
      <button class="btn primary" id="addBtn">+ Thêm nguồn</button>
      <button class="btn" id="syncBtn">Đồng bộ lại MediaMTX</button>
      <span class="spacer"></span>
      <input id="search" placeholder="Tìm theo tên, id, khu vực…">
    </div>
    <table>
      <thead><tr><th></th><th>Nguồn</th><th class="hide-sm">Loại / Kết nối</th><th class="hide-sm">Restream</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Thêm nguồn</h2>
    <div class="row">
      <label>ID (tên đường dẫn) <input name="id" required pattern="[a-z0-9][a-z0-9_\-]{0,63}" placeholder="kho-hn-cong"></label>
      <label>Tên hiển thị <input name="name" placeholder="Kho Hà Nội - Cổng"></label>
    </div>
    <div class="row">
      <label>Khu vực / Site <input name="site" placeholder="Hà Nội"></label>
      <label>Loại nguồn
        <select name="kind">
          <option value="dahua">Dahua (có IP / qua VPN)</option>
          <option value="imou_local">Imou (có IP / qua VPN)</option>
          <option value="imou_cloud">Imou không IP (qua Imou Cloud)</option>
          <option value="rtsp">RTSP bất kỳ (ONVIF, hãng khác)</option>
          <option value="push">Drone / OBS / Encoder đẩy lên (RTMP/SRT)</option>
        </select>
      </label>
    </div>

    <div data-kinds="dahua imou_local" class="row">
      <label>IP / Tên miền <input name="host" placeholder="10.8.0.12"></label>
      <label>Cổng RTSP <input name="port" type="number" placeholder="554"></label>
    </div>
    <div data-kinds="dahua imou_local" class="row">
      <label>Tài khoản <input name="username" placeholder="admin" autocomplete="off"></label>
      <label>Mật khẩu <span class="sub">(Imou: mã an toàn trên tem)</span><input name="password" type="password" autocomplete="new-password"></label>
    </div>
    <div data-kinds="dahua imou_local" class="row">
      <label>Kênh <input name="channel" type="number" min="1" placeholder="1"></label>
      <label data-create-only>Hoặc nhiều kênh (đầu ghi) <input name="channels" placeholder="1-8"></label>
    </div>

    <div data-kinds="imou_cloud" class="row">
      <label>Serial thiết bị Imou <input name="imouDeviceId" placeholder="6E0xxxxxxxx"></label>
      <label>Kênh (camera lẻ = 0) <input name="imouChannel" type="number" min="0" placeholder="0"></label>
    </div>
    <div data-kinds="imou_cloud" class="hint" id="imouHint"></div>

    <div data-kinds="rtsp">
      <label>RTSP URL <input name="url" placeholder="rtsp://user:pass@ip:554/stream1"></label>
    </div>

    <div data-kinds="push" class="hint" id="pushHint"></div>

    <div data-kinds="dahua imou_local imou_cloud rtsp" class="row">
      <label>Luồng
        <select name="subtype"><option value="1">Phụ (nhẹ, khuyên dùng)</option><option value="0">Chính (nét)</option></select>
      </label>
      <label class="check" style="align-self:end"><input type="checkbox" name="onDemand"> Chỉ kéo khi có người xem</label>
    </div>

    <label>Restream tới (mỗi dòng một đích: rtmp://, rtmps://, srt://)
      <textarea name="destinations" rows="3" placeholder="rtmps://live-api-s.facebook.com:443/rtmp/STREAM_KEY&#10;rtmp://a.rtmp.youtube.com/live2/STREAM_KEY"></textarea>
    </label>
    <div id="formErr" class="err"></div>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">Hủy</button>
      <button type="submit" class="btn primary">Lưu</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const state = { cfg: {}, sources: [], editing: null, zoom: null };
const KIND = { dahua:'Dahua', imou_local:'Imou (IP)', imou_cloud:'Imou Cloud', rtsp:'RTSP', push:'Push RTMP/SRT' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function store(key, val) { try { val === undefined ? 0 : localStorage.setItem(key, val); return localStorage.getItem(key); } catch { return null; } }

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  $('#tab-wall').classList.toggle('hidden', b.dataset.tab !== 'wall');
  $('#tab-sources').classList.toggle('hidden', b.dataset.tab !== 'sources');
  store('tab', b.dataset.tab);
});

// ---------- data ----------
async function refresh() {
  try {
    const data = await api('GET', '/api/sources');
    state.sources = data.sources || [];
    const b = $('#mtxBanner');
    b.classList.toggle('hidden', !data.mediamtxError);
    b.textContent = data.mediamtxError ? 'Không kết nối được MediaMTX: ' + data.mediamtxError : '';
  } catch (e) { console.error(e); }
  renderStat(); renderSites(); renderRows(); renderWall(false);
}

function statusOf(s) {
  if (s.online) return { cls:'on', text:'Online' };
  if (s.kind === 'push') return { cls:'idle', text:'Chờ đẩy luồng' };
  if (s.onDemand && !(s.destinations||[]).length) return { cls:'idle', text:'Chờ người xem' };
  return { cls:'', text:'Offline' };
}

function renderStat() {
  const on = state.sources.filter(s => s.online).length;
  $('#stat').innerHTML = `Online <b>${on}</b> / ${state.sources.length} nguồn`;
}

function renderSites() {
  const sel = $('#siteFilter'), cur = sel.value;
  const sites = [...new Set(state.sources.map(s => s.site).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Tất cả</option>' + sites.map(s => `<option>${esc(s)}</option>`).join('');
  sel.value = sites.includes(cur) ? cur : '';
}

// ---------- video wall ----------
let wallKey = '';
function renderWall(force) {
  const site = $('#siteFilter').value;
  const list = state.sources.filter(s => !site || s.site === site);
  let n = +$('#layout').value;
  const pages = Math.max(1, Math.ceil(list.length / n));
  const pageSel = $('#page'), curPage = Math.min(+pageSel.value || 0, pages - 1);
  pageSel.innerHTML = Array.from({length: pages}, (_, i) => `<option value="${i}">${i+1}/${pages}</option>`).join('');
  pageSel.value = curPage;

  let shown = list.slice(curPage * n, curPage * n + n);
  if (state.zoom) { const z = list.find(s => s.id === state.zoom); if (z) { shown = [z]; n = 1; } else state.zoom = null; }

  // Only rebuild iframes when the set of tiles changes, so players keep running.
  // A tile gets a player only when there is something to play: the stream is up,
  // or it is pulled on demand (opening the player is what starts the pull).
  const playable = s => s.online || (s.onDemand && !s.error && s.kind !== 'push');
  const key = n + '|' + shown.map(s => s.id + (playable(s) ? '+' : '-')).join(',');
  const grid = $('#grid');
  if (force || key !== wallKey) {
    wallKey = key;
    const cols = Math.sqrt(n);
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    const tiles = shown.map(s => `
      <div class="tile" data-id="${esc(s.id)}">
        ${playable(s)
          ? `<iframe src="${esc(state.cfg.webrtc)}/${encodeURIComponent(s.id)}/?controls=false&muted=true&autoplay=true&playsinline=true" allow="autoplay; fullscreen" loading="lazy"></iframe>`
          : `<div class="empty">${esc(s.error || statusOf(s).text)}</div>`}
        <div class="label"><span class="dot"></span><span class="name"></span></div>
      </div>`);
    for (let i = shown.length; i < n; i++) tiles.push('<div class="tile"><div class="empty">Trống</div></div>');
    grid.innerHTML = tiles.join('');
    grid.querySelectorAll('.tile[data-id]').forEach(t => t.ondblclick = () => {
      state.zoom = state.zoom ? null : t.dataset.id; renderWall(true);
    });
  }
  // Update labels in place.
  grid.querySelectorAll('.tile[data-id]').forEach(t => {
    const s = state.sources.find(x => x.id === t.dataset.id); if (!s) return;
    const st = statusOf(s);
    t.querySelector('.dot').className = 'dot ' + st.cls;
    t.querySelector('.name').textContent = `${s.name}${s.site ? ' · ' + s.site : ''}${s.viewers ? ' · 👁 ' + s.viewers : ''}`;
  });
}
['#layout', '#siteFilter', '#page'].forEach(id => $(id).onchange = e => {
  if (id !== '#page') $('#page').value = 0;
  state.zoom = null;
  if (id === '#layout') store('layout', $('#layout').value);
  renderWall(true);
});

// ---------- sources table ----------
function connText(s) {
  switch (s.kind) {
    case 'dahua': case 'imou_local': return `${s.host}:${s.port} · kênh ${s.channel} · ${s.subtype ? 'phụ' : 'chính'}`;
    case 'imou_cloud': return `Serial ${s.imouDeviceId} · kênh ${s.imouChannel}`;
    case 'rtsp': return s.url.replace(/\/\/[^@/]*@/, '//***@');
    case 'push': return `${state.cfg.rtmp}/${s.id}`;
  }
  return '';
}
function renderRows() {
  const q = $('#search').value.trim().toLowerCase();
  const list = state.sources.filter(s => !q || [s.id, s.name, s.site].join(' ').toLowerCase().includes(q));
  $('#rows').innerHTML = list.map(s => {
    const st = statusOf(s);
    return `<tr>
      <td><span class="dot ${st.cls}"></span></td>
      <td><b>${esc(s.name)}</b><div class="sub">${esc(s.id)}${s.site ? ' · ' + esc(s.site) : ''}</div></td>
      <td class="hide-sm">${KIND[s.kind] || esc(s.kind)}<div class="sub">${esc(connText(s))}</div></td>
      <td class="hide-sm">${(s.destinations||[]).length ? (s.destinations.length + ' đích') : '<span class="sub">—</span>'}</td>
      <td>${st.text}${s.tracks?.length ? `<div class="sub">${esc(s.tracks.join(', '))}</div>` : ''}${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}</td>
      <td style="white-space:nowrap"><button class="btn small" data-edit="${esc(s.id)}">Sửa</button> <button class="btn small danger" data-del="${esc(s.id)}">Xóa</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="sub">Chưa có nguồn nào. Bấm “+ Thêm nguồn”.</td></tr>';
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(state.sources.find(s => s.id === b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Xóa nguồn ' + b.dataset.del + '?')) return;
    try { await api('DELETE', '/api/sources/' + encodeURIComponent(b.dataset.del)); refresh(); } catch (e) { alert(e.message); }
  });
}
$('#search').oninput = renderRows;

// ---------- form ----------
const form = $('#form'), el = form.elements;
function toggleKindFields() {
  const kind = el.kind.value;
  form.querySelectorAll('[data-kinds]').forEach(x => x.classList.toggle('hidden', !x.dataset.kinds.split(' ').includes(kind)));
  form.querySelectorAll('[data-create-only]').forEach(x => x.classList.toggle('hidden', !!state.editing));
  const id = esc(el.id.value) || '&lt;id&gt;';
  $('#pushHint').innerHTML = `Cấu hình drone / OBS / encoder đẩy lên:<br>
    <b>RTMP:</b> ${esc(state.cfg.rtmp)}/${id}?user=publisher&amp;pass=MAT_KHAU<br>
    <b>SRT:</b> ${esc(state.cfg.srt)}?streamid=publish:${id}:publisher:MAT_KHAU<br>
    (Tài khoản publisher đặt trong mediamtx.yml)`;
  $('#imouHint').innerHTML = state.cfg.imou
    ? 'Thiết bị phải được gắn vào tài khoản developer Imou (serial + mã an toàn) trước. Luồng đi qua cloud Imou nên có độ trễ.'
    : '<span class="err">Chưa cấu hình IMOU_APP_ID / IMOU_APP_SECRET trên server.</span>';
}
el.kind.onchange = toggleKindFields;
el.id.oninput = toggleKindFields;

function openForm(src) {
  state.editing = src || null;
  form.reset();
  $('#formErr').textContent = '';
  $('#dlgTitle').textContent = src ? 'Sửa nguồn ' + src.id : 'Thêm nguồn';
  el.id.readOnly = !!src;
  if (src) {
    for (const k of ['id','name','site','kind','host','port','username','password','channel','imouDeviceId','imouChannel','url','subtype'])
      if (el[k]) el[k].value = src[k] ?? '';
    el.onDemand.checked = !!src.onDemand;
    el.destinations.value = (src.destinations || []).join('\n');
  } else {
    el.subtype.value = '1';
  }
  toggleKindFields();
  $('#dlg').showModal();
}
$('#addBtn').onclick = () => openForm(null);
$('#cancelBtn').onclick = () => $('#dlg').close();

form.onsubmit = async e => {
  e.preventDefault();
  const kind = el.kind.value;
  const body = {
    id: el.id.value.trim(), name: el.name.value.trim(), site: el.site.value.trim(), kind,
    subtype: +el.subtype.value, onDemand: el.onDemand.checked,
    destinations: el.destinations.value.split('\n').map(x => x.trim()).filter(Boolean),
  };
  if (kind === 'dahua' || kind === 'imou_local') {
    Object.assign(body, { host: el.host.value.trim(), port: +el.port.value || 0, username: el.username.value.trim(),
      password: el.password.value, channel: +el.channel.value || 0 });
    if (!state.editing && el.channels.value.trim()) body.channels = el.channels.value.trim();
  }
  if (kind === 'imou_cloud') Object.assign(body, { imouDeviceId: el.imouDeviceId.value.trim(), imouChannel: +el.imouChannel.value || 0 });
  if (kind === 'rtsp') body.url = el.url.value.trim();
  try {
    const res = state.editing
      ? await api('PUT', '/api/sources/' + encodeURIComponent(state.editing.id), (({channels, ...b}) => b)(body))
      : await api('POST', '/api/sources', body);
    if (res?.warnings?.length) alert('Đã lưu, nhưng chưa áp dụng được:\n' + res.warnings.join('\n'));
    $('#dlg').close();
    refresh();
  } catch (err) { $('#formErr').textContent = err.message; }
};

$('#syncBtn').onclick = async () => { await api('POST', '/api/sync').catch(e => alert(e.message)); refresh(); };

// ---------- boot ----------
(async () => {
  state.cfg = await api('GET', '/api/config');
  const layout = store('layout'); if (layout) $('#layout').value = layout;
  const tab = store('tab'); if (tab) document.querySelector(`nav button[data-tab="${tab}"]`)?.click();
  await refresh();
  renderWall(true);
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
